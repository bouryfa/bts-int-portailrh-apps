version: '3.8'

services:
  # Service MySQL pour la base de données
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword  # Mot de passe root MySQL
      MYSQL_DATABASE: hr_portal          # Base de données créée automatiquement
    ports:
      - "3306:3306"  # Port MySQL exposé
    volumes:
      - mysql_data:/var/lib/mysql  # Volume persistant pour les données

  # Service Flask pour l'application web
  app:
    build: .  # Construction depuis le Dockerfile local
    ports:
      - "9000:5000"  # Port Flask exposé
    environment:
      # Variables de connexion à MySQL
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: hr_portal
      MYSQL_PORT: 3306
      DEBUG: "True"
    depends_on:
      - mysql  # Démarrage après MySQL

# Volume nommé pour la persistance des données MySQL
volumes:
  mysql_data: